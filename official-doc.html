<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البوابة الذكية – منشئ الكتب الرسمية</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body, input, textarea, button, .doc {
  font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
}

:root {
  --green: #1a6b2f;
  --gold: #c9a227;
  --ink: #111;
}

body {
  background: #f0f2f0;
  display: flex;
  gap: 20px;
  justify-content: center;
  padding: 30px;
  flex-wrap: wrap;
}

.panel {
  width: 340px;
  background: #fff;
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  position: sticky;
  top: 20px;
  height: fit-content;
  max-height: 90vh;
  overflow-y: auto;
}

fieldset {
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

legend {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--gold);
  padding: 0 8px;
}

.att-item {
  display: flex;
  gap: 5px;
  margin-bottom: 8px;
}

.att-item input { flex-grow: 1; }

.btn-del {
  background: #ff4d4d;
  color: white;
  border: none;
  border-radius: 5px;
  width: 30px;
  cursor: pointer;
}

.btn-add {
  background: #eee;
  color: #333;
  padding: 5px;
  font-size: 0.7rem;
  margin-top: 5px;
  border-radius: 5px;
  cursor: pointer;
}

input, textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  margin-top: 5px;
  font-size: 0.9rem;
}

.btn-pdf { background: var(--green); color: white; border-radius: 10px; padding: 12px; font-weight: bold; width: 100%; cursor: pointer; border: none; margin-top: 10px; }

/* وثيقة A4 */
.page {
  width: 210mm;
  height: 297mm;
  /* سيتم تعيين الخلفية ديناميكياً بواسطة JS بعد تحويلها إلى Base64 */
  background-size: cover;
  background-position: center;
  position: relative;
  background-color: white;
}

.doc {
  position: absolute;
  inset: 40mm 20mm 30mm 20mm;
  display: flex;
  flex-direction: column;
}

.doc-header { display: flex; justify-content: flex-end; margin-bottom: 10mm; }
.meta-box { text-align: right; font-size: 11pt; line-height: 1.6; }
.recipient-section { font-weight: 700; font-size: 13pt; margin-bottom: 5mm; }
.subject-container { text-align: center; margin-bottom: 10mm; }
.subject-line { display: inline-block; font-weight: 700; font-size: 14pt; border-bottom: 2px solid var(--ink); padding-bottom: 5px; }
.body-content { text-align: justify; font-size: 12pt; line-height: 1.9; flex-grow: 1; }
.signature-wrap { display: flex; justify-content: flex-end; padding-bottom: 20mm; }
.signature-box { text-align: center; min-width: 200px; }
.attachments-section { font-size: 10pt; color: #444; border-top: 1px solid #eee; padding-top: 5px; }

@media print { .panel { display: none; } }
</style>
</head>
<body>

<div class="panel" id="controlPanel">
  <fieldset>
    <legend>بيانات الترويسة</legend>
    <label>الهجري <input type="text" id="dateH" value="14 محرم 1447هـ"></label>
    <label>الميلادي <input type="text" id="dateM" value="10 يوليو 2026م"></label>
    <label>الرقم <input type="text" id="docNum" value="ف/ج/2026/10"></label>
  </fieldset>

  <fieldset>
    <legend>المحتوى</legend>
    <label>المرسل إليه <input type="text" id="recipient" value="السيد/ مدير الإدارة"></label>
    <label>الموضوع <input type="text" id="subject" value="تحديث بيانات الموظفين"></label>
    <label>النص <textarea id="bodyText">بالإشارة إلى الموضوع أعلاه، يرجى التكرم بالعلم بأنه قد تم تحديث كافة البيانات المطلوبة وفقاً للوائح المعمول بها.</textarea></label>
  </fieldset>

  <fieldset>
    <legend>المرفقات</legend>
    <div id="attachmentsList"></div>
    <button class="btn-add" id="addAttBtn">+ إضافة مرفق جديد</button>
  </fieldset>

  <fieldset>
    <legend>التوقيع</legend>
    <label>المنصب <input type="text" id="signName" value="رئيس المركز"></label>
  </fieldset>

  <button class="btn-pdf" id="btnPDF">حفظ كـ PDF</button>
</div>

<div class="page" id="page">
  <div class="doc" id="doc"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let attachments = ["نسخة من القرار المعتمد"];
let backgroundDataURL = null;  // لتخزين الخلفية بصيغة Base64

// تحويل صورة الخلفية إلى Base64 مسبقاً لحل مشكلة CORS
async function loadBackgroundAsBase64() {
  const imageUrl = 'https://i.ibb.co/WWmVm38y/2.jpg';
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "Anonymous";  // محاولة الحصول على CORS (قد لا تنجح إذا كان الخادم لا يسمح)
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const dataURL = canvas.toDataURL('image/jpeg');
      resolve(dataURL);
    };
    img.onerror = () => reject(new Error('فشل تحميل الصورة'));
    img.src = imageUrl;
  });
}

// تطبيق الخلفية على عنصر الصفحة باستخدام Base64
function setBackgroundFromBase64(dataURL) {
  $('page').style.backgroundImage = `url('${dataURL}')`;
  $('page').style.backgroundSize = 'cover';
  $('page').style.backgroundPosition = 'center';
}

// وظائف المرفقات
function addAttachment() {
    attachments.push("");
    renderControls();
    updateDoc();
}

function removeAttachment(index) {
    attachments.splice(index, 1);
    renderControls();
    updateDoc();
}

function renderControls() {
    const list = $('attachmentsList');
    list.innerHTML = "";
    attachments.forEach((att, i) => {
        list.innerHTML += `
            <div class="att-item">
                <input type="text" value="${escapeHtml(att)}" oninput="attachments[${i}]=this.value; updateDoc()">
                <button class="btn-del" onclick="removeAttachment(${i})">✕</button>
            </div>`;
    });
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

function updateDoc() {
    const attHtml = attachments.filter(a => a.trim() !== "").map(a => `• ${escapeHtml(a)}`).join('<br>');
    
    $('doc').innerHTML = `
        <div class="doc-header">
            <div class="meta-box">
                <div>التاريخ الهجري: ${escapeHtml($('dateH').value)}</div>
                <div>التاريخ الميلادي: ${escapeHtml($('dateM').value)}</div>
                <div>رقم الكتاب: ${escapeHtml($('docNum').value)}</div>
            </div>
        </div>

        <div class="recipient-section">الأخ الكريم/ ${escapeHtml($('recipient').value)} المحترم</div>
        <div class="salutation">السلام عليكم ورحمة الله وبركاته،، وبعد</div>

        <div class="subject-container">
            <div class="subject-line">الموضوع: ${escapeHtml($('subject').value)}</div>
        </div>

        <div class="body-content">
            ${$('bodyText').value.replace(/\n/g, '<br>').replace(/</g, '&lt;').replace(/>/g, '&gt;')}
            <br><br>
            وتقبلوا منا فائق الاحترام والتقدير،،
        </div>

        <div class="signature-wrap">
            <div class="signature-box">
                <div style="font-weight:bold">${escapeHtml($('signName').value)}</div>
                <br><br>
                __________________
            </div>
        </div>

        <div class="attachments-section" style="${attachments.length > 0 && attachments.some(a=>a.trim()) ? '' : 'display:none'}">
            <b>المرفقات:</b><br>
            ${attHtml}
        </div>
    `;
}

// ربط الأحداث
const ids = ['dateH', 'dateM', 'docNum', 'recipient', 'subject', 'bodyText', 'signName'];
ids.forEach(id => $(id).addEventListener('input', updateDoc));
$('addAttBtn').onclick = addAttachment;

// زر PDF مع تجهيز الخلفية
$('btnPDF').onclick = async () => {
    const btn = $('btnPDF');
    const originalText = btn.innerText;
    btn.innerText = 'جاري تجهيز PDF...';
    btn.disabled = true;
    
    try {
        // التأكد من وجود الخلفية بصيغة Base64
        if (!backgroundDataURL) {
            // محاولة تحميل الخلفية وتحويلها
            backgroundDataURL = await loadBackgroundAsBase64();
            setBackgroundFromBase64(backgroundDataURL);
        }
        
        // انتظار بسيط لتطبيق الخلفية
        await new Promise(r => setTimeout(r, 50));
        
        // استخدام html2canvas مع خيارات CORS والخلفية
        const canvas = await html2canvas($('page'), {
            scale: 3,
            useCORS: true,
            allowTaint: false,
            backgroundColor: null
        });
        
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
        pdf.save("كتاب_رسمي.pdf");
    } catch (error) {
        console.error(error);
        alert('حدث خطأ أثناء إنشاء PDF. قد تكون الخلفية غير متاحة بسبب سياسات الموقع. حاول استخدام صورة محلية أو رابط يدعم CORS.');
    } finally {
        btn.innerText = originalText;
        btn.disabled = false;
    }
};

// بدء التطبيق: تحميل الخلفية أولاً ثم عرض المستند
window.onload = async () => {
    renderControls();
    updateDoc();
    try {
        backgroundDataURL = await loadBackgroundAsBase64();
        setBackgroundFromBase64(backgroundDataURL);
    } catch(e) {
        console.warn('لا يمكن تحميل الخلفية، سيتم استخدام لون أبيض بدلاً منها');
        $('page').style.backgroundColor = '#fff';
    }
};
</script>
</body>
</html>
