<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام التكاليف</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Arabic', sans-serif;
      background: #f7faf8;
    }
    .primary-bg {
      background: #097834;
    }
    .primary-text {
      color: #097834;
    }
    .soft-card {
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>
  <div class="min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto bg-white rounded-3xl soft-card overflow-hidden border border-gray-100">
      <div class="primary-bg text-white p-6">
        <h1 class="text-2xl font-extrabold">نظام التكاليف</h1>
        <p class="text-sm mt-2 opacity-90">صفحة واحدة للمدير والموظف</p>
      </div>

      <div class="p-6">
        <!-- قسم المدير -->
        <div id="managerSection" class="space-y-6 hidden">
          <div class="bg-green-50 border border-green-100 rounded-2xl p-4 text-green-800 text-sm">
            من هنا تقدر تنشئ التكليف، وبعد الحفظ يتحول مباشرة للواتساب برسالة جاهزة فيها رابط رد الموظف.
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block font-bold mb-2">اسم الجهة الطالبة</label>
              <input id="requesterName" type="text" class="w-full border border-gray-200 rounded-2xl p-4" placeholder="اكتب الاسم" />
            </div>

            <div>
              <label class="block font-bold mb-2">اسم الموظف المكلف</label>
              <input id="employeeName" type="text" class="w-full border border-gray-200 rounded-2xl p-4" placeholder="اكتب الاسم" />
            </div>

            <div class="md:col-span-2">
              <label class="block font-bold mb-2">تفاصيل التكليف</label>
              <textarea id="taskDetails" rows="6" class="w-full border border-gray-200 rounded-2xl p-4" placeholder="اكتب تفاصيل التكليف بشكل واضح"></textarea>
            </div>

            <div>
              <label class="block font-bold mb-2">آخر موعد</label>
              <input id="dueDate" type="date" class="w-full border border-gray-200 rounded-2xl p-4" />
            </div>
          </div>

          <button id="createTaskBtn" type="button" class="w-full primary-bg text-white rounded-2xl py-4 font-bold text-lg hover:opacity-95 transition">
            حفظ وإرسال للواتساب
          </button>

          <div id="managerMessage" class="hidden rounded-2xl p-4 text-sm"></div>
        </div>

        <!-- قسم الموظف -->
        <div id="employeeSection" class="space-y-6 hidden">
          <div id="loadingBox" class="text-center text-gray-500 py-8">جاري تحميل بيانات التكليف...</div>

          <div id="taskBox" class="hidden space-y-5">
            <div class="grid md:grid-cols-2 gap-4">
              <div class="bg-gray-50 rounded-2xl p-4">
                <div class="text-sm text-gray-500">رقم التكليف</div>
                <div id="taskIdText" class="font-bold text-lg primary-text"></div>
              </div>

              <div class="bg-gray-50 rounded-2xl p-4">
                <div class="text-sm text-gray-500">حالة التكليف</div>
                <div id="taskStatusText" class="font-bold text-lg"></div>
              </div>

              <div class="bg-gray-50 rounded-2xl p-4">
                <div class="text-sm text-gray-500">اسم الجهة الطالبة</div>
                <div id="requesterNameText" class="font-bold"></div>
              </div>

              <div class="bg-gray-50 rounded-2xl p-4">
                <div class="text-sm text-gray-500">اسم الموظف المكلف</div>
                <div id="employeeNameText" class="font-bold"></div>
              </div>

              <div class="bg-gray-50 rounded-2xl p-4 md:col-span-2">
                <div class="text-sm text-gray-500">تفاصيل التكليف</div>
                <div id="taskDetailsText" class="font-bold leading-8 whitespace-pre-wrap"></div>
              </div>

              <div class="bg-gray-50 rounded-2xl p-4">
                <div class="text-sm text-gray-500">آخر موعد</div>
                <div id="dueDateText" class="font-bold"></div>
              </div>
            </div>

            <div class="border-t pt-6">
              <label class="block font-bold mb-2">رد الموظف</label>
              <textarea id="replyText" rows="6" class="w-full border border-gray-200 rounded-2xl p-4 focus:outline-none focus:ring-2 focus:ring-green-700" placeholder="اكتب الرد هنا"></textarea>
            </div>

            <div>
              <label class="block font-bold mb-2">إرفاق ملف</label>
              <input id="fileInput" type="file" class="w-full border border-gray-200 rounded-2xl p-3 bg-white" />
              <div id="fileNameText" class="text-sm text-gray-500 mt-2"></div>
              <div class="text-xs text-gray-400 mt-1">المرفقات المناسبة: صور، PDF، Word، Excel</div>
            </div>

            <button id="submitReplyBtn" type="button" class="w-full primary-bg text-white rounded-2xl py-4 font-bold text-lg hover:opacity-95 transition">
              إرسال الرد
            </button>

            <div id="employeeMessage" class="hidden rounded-2xl p-4 text-sm"></div>
          </div>

          <div id="errorBox" class="hidden bg-red-50 text-red-700 p-4 rounded-2xl"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyZDfTUZFucwgs_n35UZU6-tQcwXYZK2KIW5Hw5TU7xvhJ8SB1O5eFC_wtjUS0jfnwD/exec';
    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('id');

    const managerSection = document.getElementById('managerSection');
    const employeeSection = document.getElementById('employeeSection');

    if (taskId) {
      employeeSection.classList.remove('hidden');
      loadTask();
    } else {
      managerSection.classList.remove('hidden');
    }

    function showBox(id, text, type) {
      const box = document.getElementById(id);
      box.classList.remove('hidden');
      box.textContent = text;

      if (type === 'success') {
        box.className = 'rounded-2xl p-4 text-sm bg-green-50 text-green-700';
      } else {
        box.className = 'rounded-2xl p-4 text-sm bg-red-50 text-red-700';
      }
    }

    function generateTaskId() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return 'TASK-' +
        now.getFullYear() +
        pad(now.getMonth() + 1) +
        pad(now.getDate()) + '-' +
        pad(now.getHours()) +
        pad(now.getMinutes()) +
        pad(now.getSeconds());
    }

    async function createTask() {
      const requesterName = document.getElementById('requesterName').value.trim();
      const employeeName = document.getElementById('employeeName').value.trim();
      const taskDetails = document.getElementById('taskDetails').value.trim();
      const dueDate = document.getElementById('dueDate').value;
      const btn = document.getElementById('createTaskBtn');

      if (!requesterName || !employeeName || !taskDetails) {
        showBox('managerMessage', 'اكمل البيانات الأساسية', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري الحفظ...';

      try {
        const newTaskId = generateTaskId();
        const taskLink = window.location.origin + window.location.pathname + '?id=' + encodeURIComponent(newTaskId);

        const payload = {
          action: 'createTask',
          taskId: newTaskId,
          requesterName: requesterName,
          employeeName: employeeName,
          taskDetails: taskDetails,
          dueDate: dueDate,
          taskLink: taskLink
        };

        const response = await fetch(scriptURL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!result.success) {
          showBox('managerMessage', result.message || 'ما تم حفظ التكليف', 'error');
          btn.disabled = false;
          btn.textContent = 'حفظ وإرسال للواتساب';
          return;
        }

        const messageText =
          'السلام عليكم\n' +
          'تم إصدار تكليف جديد لك.\n\n' +
          'رقم التكليف: ' + newTaskId + '\n' +
          'الجهة الطالبة: ' + requesterName + '\n' +
          'اسم الموظف: ' + employeeName + '\n' +
          'تفاصيل التكليف: ' + taskDetails + '\n' +
          'آخر موعد: ' + (dueDate || '-') + '\n\n' +
          'رابط الرد على التكليف:\n' +
          taskLink;

        showBox('managerMessage', 'تم حفظ التكليف، وجاري تحويلك إلى الواتساب', 'success');
        btn.textContent = 'تم الحفظ';

        setTimeout(() => {
          window.location.href = 'https://wa.me/?text=' + encodeURIComponent(messageText);
        }, 300);

      } catch (error) {
        showBox('managerMessage', 'صار خطأ أثناء الحفظ أو الربط مع السكربت', 'error');
        btn.disabled = false;
        btn.textContent = 'حفظ وإرسال للواتساب';
        console.error(error);
      }
    }

    async function loadTask() {
      const loadingBox = document.getElementById('loadingBox');
      const taskBox = document.getElementById('taskBox');
      const errorBox = document.getElementById('errorBox');

      try {
        const response = await fetch(scriptURL + '?action=getTask&taskId=' + encodeURIComponent(taskId));
        const data = await response.json();

        if (!data.success || !data.task) {
          loadingBox.classList.add('hidden');
          errorBox.classList.remove('hidden');
          errorBox.textContent = 'التكليف غير موجود أو الرابط غير صحيح';
          return;
        }

        const task = data.task;

        loadingBox.classList.add('hidden');
        taskBox.classList.remove('hidden');

        document.getElementById('taskIdText').textContent = task.taskId || '-';
        document.getElementById('taskStatusText').textContent = task.taskStatus || '-';
        document.getElementById('requesterNameText').textContent = task.requesterName || '-';
        document.getElementById('employeeNameText').textContent = task.employeeName || '-';
        document.getElementById('taskDetailsText').textContent = task.taskDetails || '-';
        document.getElementById('dueDateText').textContent = task.dueDate || '-';

      } catch (error) {
        loadingBox.classList.add('hidden');
        errorBox.classList.remove('hidden');
        errorBox.textContent = 'صار خطأ أثناء تحميل بيانات التكليف';
        console.error(error);
      }
    }

    let selectedFile = null;

    document.getElementById('fileInput')?.addEventListener('change', function () {
      selectedFile = this.files[0] || null;
      document.getElementById('fileNameText').textContent = selectedFile ? ('الملف المختار: ' + selectedFile.name) : '';
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function submitReply() {
      const replyText = document.getElementById('replyText').value.trim();
      const btn = document.getElementById('submitReplyBtn');

      if (!replyText && !selectedFile) {
        showBox('employeeMessage', 'اكتب رد أو ارفع ملف على الأقل', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';

      try {
        const payload = {
          action: 'submitReply',
          taskId: taskId,
          replyText: replyText
        };

        if (selectedFile) {
          const base64Data = await fileToBase64(selectedFile);
          payload.fileBase64 = base64Data;
          payload.fileName = selectedFile.name;
          payload.mimeType = selectedFile.type || 'application/octet-stream';
        }

        const response = await fetch(scriptURL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          showBox('employeeMessage', 'تم إرسال الرد بنجاح', 'success');
          btn.textContent = 'تم الإرسال';
        } else {
          showBox('employeeMessage', result.message || 'تعذر إرسال الرد', 'error');
          btn.disabled = false;
          btn.textContent = 'إرسال الرد';
        }

      } catch (error) {
        showBox('employeeMessage', 'صار خطأ أثناء الإرسال', 'error');
        btn.disabled = false;
        btn.textContent = 'إرسال الرد';
        console.error(error);
      }
    }

    document.getElementById('createTaskBtn')?.addEventListener('click', createTask);
    document.getElementById('submitReplyBtn')?.addEventListener('click', submitReply);
  </script>
</body>
</html>
